[project]
name = "evc"
version = "0.1.0"
description = "Causal analysis of scheduled macro events on USDJPY implied volatility"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "statsmodels",
    "scikit-learn",
    "openpyxl",
]

[project.optional-dependencies]
proxy = ["yfinance"]
fred = ["requests"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The editable install's site-packages .pth is unreliable under this
# Python 3.14 build (site.py silently fails to process it in some
# runs -- reproduced directly, not assumed). Have pytest add src/ to
# sys.path itself rather than depend on it.
pythonpath = ["src"]
